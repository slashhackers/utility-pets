name: Build & Test

on:
  workflow_call:

jobs:
  build-and-test:
    name: Build & Run Unit Tests
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Run Unit Tests
        run: swift test

      - name: Build Native App & Installers (.pkg & .dmg)
        run: bash scripts/build-installers.sh
