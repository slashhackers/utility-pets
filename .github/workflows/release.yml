name: Release & Publish Native macOS App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Native Utility Pet App
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Run Unit Tests
        run: swift test

      - name: Build Native App & Installers (.pkg & .dmg)
        run: bash scripts/build-installers.sh

      - name: Package Release Artifacts
        run: |
          cp dist/UtilityPets.pkg .
          cp dist/UtilityPets.dmg .
          
          # Generate SHA256 checksums
          shasum -a 256 UtilityPets.pkg UtilityPets.dmg > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Utility Pet ${{ github.ref_name }} (Stable)"
          files: |
            UtilityPets.pkg
            UtilityPets.dmg
            checksums.txt
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            ### 🐾 Utility Pet macOS Release (Stable)
            
            #### 🚀 Installation Options:
            - **Installer Package:** Download `UtilityPets.pkg`
            - **Disk Image:** Download `UtilityPets.dmg`
            
            #### 1-Line Remote Installer Command:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/master/install.sh | bash
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}




